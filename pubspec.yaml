version: 0.9.0+9

environment:
  sdk: ">=3.4.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  provider: ^6.1.2
  flutter_blue_plus: ^1.34.5
  permission_handler: ^11.3.1
  geolocator: ^13.0.2
  sqflite: ^2.4.1
  path: ^1.9.0
  flutter_map: ^7.0.2
