  geocoding: ^3.0.0
  fl_chart: ^0.69.2
  share_plus: ^10.1.2
  path_provider: ^2.1.5
  firebase_core: ^3.8.0
  firebase_auth: ^5.3.4
  cloud_firestore: ^5.5.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
